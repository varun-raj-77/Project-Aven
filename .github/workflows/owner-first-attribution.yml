name: Owner-first attribution

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  attribution:
    name: Verify historical and owner-first attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Verify pinned tags and owner-first commit history
        run: |
          node tooling/attribution/check-post-aven010.mjs --self-test
          node tooling/attribution/check-post-aven010.mjs
      - name: Install dependencies (temporary CI-only native approvals)
        run: |
          cp pnpm-workspace.yaml "$RUNNER_TEMP/workspace.original"
          printf '\nallowBuilds:\n  better-sqlite3: true\n  esbuild: true\n' >> pnpm-workspace.yaml
          pnpm install --frozen-lockfile
      - name: Restore original workspace configuration
        run: |
          cp "$RUNNER_TEMP/workspace.original" pnpm-workspace.yaml
          git diff --exit-code -- pnpm-workspace.yaml
      - name: Run postfreeze current-tree checks
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          bash -e -c "$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).scripts.check)')"
          node tooling/attribution/check-post-aven010.mjs
      - name: Run unchanged AVEN-010 checks at frozen tag
        run: |
          git worktree add --detach "$RUNNER_TEMP/aven010" refs/tags/aven-010
          (
            cd "$RUNNER_TEMP/aven010"
            cp pnpm-workspace.yaml "$RUNNER_TEMP/aven010-workspace.original"
            printf '\nallowBuilds:\n  better-sqlite3: true\n  esbuild: true\n' >> pnpm-workspace.yaml
            pnpm install --frozen-lockfile
            cp "$RUNNER_TEMP/aven010-workspace.original" pnpm-workspace.yaml
            git diff --exit-code -- pnpm-workspace.yaml
            export PATH="$PWD/node_modules/.bin:$PATH"
            bash -e -c "$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).scripts.check)')"
            node tooling/attribution/check-attribution.ts
          )
